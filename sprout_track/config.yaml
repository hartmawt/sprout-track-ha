name: "Sprout Track"
description: "Baby tracking — feeds, sleep, diapers, milestones, and growth charts"
version: "1.6.7"
slug: "sprout_track"
url: "https://github.com/hartmawt/sprout-track-ha"
arch:
  - aarch64
  - amd64

# The app cannot be served through ingress: Next.js resolves basePath at build
# time and ingress assigns a random prefix per session. Ingress is enabled only
# so Home Assistant offers the "Show in sidebar" toggle; ingress_port serves a
# redirect to the app's own port. Do not point ingress_port at the app.
ingress: true
ingress_port: 8099
panel_icon: "mdi:baby-carriage"
panel_title: "Sprout Track"
panel_admin: false

startup: application
boot: auto

ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Sprout Track web interface"

webui: "http://[HOST]:[PORT:3000]"

# /data is the add-on's persistent volume; it is included in Home Assistant
# backups. The databases, generated secrets, and uploads all live there.
options:
  timezone: ""
  enable_notifications: false
  app_url: ""
  enable_log: false

schema:
  timezone: "str?"
  enable_notifications: "bool"
  app_url: "str?"
  enable_log: "bool"
