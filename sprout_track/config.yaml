name: "Sprout Track"
description: "Baby tracking — feeds, sleep, diapers, milestones, and growth charts"
version: "1.6.7"
slug: "sprout_track"
url: "https://github.com/hartmawt/sprout-track-ha"
arch:
  - aarch64
  - amd64

# hassio_api lets the add-on read its own ingress path, which it needs because
# Next.js resolves basePath at build time and the path is only known once the
# add-on is installed. run.sh rebuilds the app against it on first start.
ingress: true
ingress_port: 8099
hassio_api: true
panel_icon: "mdi:baby-carriage"
panel_title: "Sprout Track"
panel_admin: false

startup: application
boot: auto

ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Sprout Track web interface"

# /data is the add-on's persistent volume; it is included in Home Assistant
# backups. The databases, generated secrets, and uploads all live there.
options:
  timezone: ""
  enable_notifications: false
  app_url: ""
  enable_log: false

schema:
  timezone: "str?"
  enable_notifications: "bool"
  app_url: "str?"
  enable_log: "bool"
