name: "Sprout Track"
description: "Baby tracking — feeds, sleep, diapers, milestones, and growth charts"
version: "1.6.7"
slug: "sprout_track"
url: "https://github.com/hartmawt/sprout-track-ha"
arch:
  - aarch64
  - amd64

# The app cannot be proxied through ingress: Next.js resolves basePath at build
# time, and its client router reads location.pathname, which cannot be rewritten
# from outside the app. Ingress is enabled to obtain the sidebar entry, and
# ingress_port serves a page that frames the app at its own origin.
ingress: true
ingress_port: 8099
panel_icon: "mdi:baby-carriage"
panel_title: "Sprout Track"
panel_admin: false

# Read-only access to Home Assistant's certificates. A page framed on an HTTPS
# dashboard cannot load an HTTP source, so the app is served over HTTPS when a
# certificate is available.
map:
  - ssl:ro

startup: application
boot: auto

ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Sprout Track web interface"

# /data is the add-on's persistent volume; it is included in Home Assistant
# backups. The databases, generated secrets, and uploads all live there.
options:
  timezone: ""
  enable_notifications: false
  app_url: ""
  enable_log: false

schema:
  timezone: "str?"
  enable_notifications: "bool"
  app_url: "str?"
  enable_log: "bool"
