name: "Sprout Track"
description: "Baby tracking — feeds, sleep, diapers, milestones, and growth charts"
version: "1.6.7"
slug: "sprout_track"
url: "https://github.com/hartmawt/sprout-track-ha"
arch:
  - aarch64
  - amd64

# Ingress requires a runtime URL prefix; Next.js only supports basePath at
# build time, so the app's absolute /_next and /api URLs would resolve against
# the Home Assistant root and never reach this add-on. Do not enable.
ingress: false

startup: application
boot: auto

ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Sprout Track web interface"

webui: "http://[HOST]:[PORT:3000]"

# /data is the add-on's persistent volume; it is included in Home Assistant
# backups. The databases, generated secrets, and uploads all live there.
options:
  timezone: ""
  enable_notifications: false
  app_url: ""
  enable_log: false

schema:
  timezone: "str?"
  enable_notifications: "bool"
  app_url: "str?"
  enable_log: "bool"
